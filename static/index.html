<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Agent - 세션 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fb;
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .app {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }
        .panel {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .panel-header {
            padding: 16px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 700;
        }
        .panel-body { padding: 16px; }
        .field { margin-bottom: 12px; }
        .field label { font-size: 12px; color: #666; display: block; margin-bottom: 6px; }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .btn.secondary { background: #6c757d; }
        .btn.danger { background: #dc3545; }
        .btn + .btn { margin-top: 8px; }
        .session-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .session-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .session-card.active { border-color: #667eea; box-shadow: 0 6px 16px rgba(102,126,234,0.15); }
        .session-meta { font-size: 12px; color: #777; margin-top: 6px; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
        }
        .chat-title { font-weight: 700; }
        .chat-sub { font-size: 12px; color: #666; }
        .chat-container {
            height: 60vh;
            overflow-y: auto;
            padding: 18px;
            background: #fafbff;
        }
        .message-group { margin-bottom: 14px; }
        .message-label { font-size: 11px; color: #666; margin: 0 0 4px 6px; }
        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }
        .role-user { background: #667eea; color: #fff; margin-left: auto; }
        .role-assistant { background: #fff; border: 1px solid #e5e7f1; }
        .role-judge { background: #fff4e6; border-left: 4px solid #ff922b; }
        .role-moderator { background: #e7f5ff; border-left: 4px solid #339af0; }
        .role-system { background: #f1f3f5; border-left: 4px solid #adb5bd; }

        .chat-input {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #eee;
        }
        .chat-input input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .status {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #f1f3f5; margin-left: 6px; }
        
        .agent-status {
            padding: 12px 18px;
            border-top: 1px solid #eee;
            background: #fafbff;
            font-size: 13px;
            color: #495057;
            min-height: 45px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .agent-status.hidden { display: none; }
        .status-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #6c757d;
            animation: pulse 1.5s infinite;
        }
        .status-icon.thinking { background: #667eea; }
        .status-icon.tool { background: #ff922b; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text { font-weight: 500; }
        .status-detail { color: #868e96; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app">
        <div class="panel">
            <div class="panel-header">세션 관리</div>
            <div class="panel-body">
                <div class="field">
                    <label>유저 ID</label>
                    <input id="userIdInput" />
                </div>
                <div class="field">
                    <label>토론 주제</label>
                    <input id="topicInput" placeholder="예: AI의 미래" />
                </div>
                <div class="field">
                    <label>당신의 입장</label>
                    <select id="userRoleSelect" style="width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
                        <option value="pro">찬성 측</option>
                        <option value="con">반대 측</option>
                    </select>
                </div>
                <button class="btn" onclick="createSession()">세션 생성</button>
                <button class="btn secondary" onclick="refreshSessions()">세션 목록 새로고침</button>
                <div class="session-list" id="sessionList"></div>
                <div class="status" id="sessionStatus"></div>
            </div>
        </div>

        <div class="panel">
            <div class="chat-header">
                <div>
                    <div class="chat-title">대화</div>
                    <div class="chat-sub" id="chatSub">세션을 선택해 주세요.</div>
                </div>
                <button class="btn danger" style="width:auto;" onclick="deleteSession()">세션 삭제</button>
            </div>
            <div class="chat-container" id="chatContainer"></div>
            <div class="agent-status hidden" id="agentStatus">
                <div class="status-icon"></div>
                <div class="status-text"></div>
                <div class="status-detail"></div>
            </div>
            <div class="chat-input">
                <input id="messageInput" placeholder="메시지를 입력하세요" />
                <button class="btn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const userIdInput = document.getElementById('userIdInput');
        const topicInput = document.getElementById('topicInput');
        const sessionList = document.getElementById('sessionList');
        const sessionStatus = document.getElementById('sessionStatus');
        const chatContainer = document.getElementById('chatContainer');
        const chatSub = document.getElementById('chatSub');
        const messageInput = document.getElementById('messageInput');
        const agentStatus = document.getElementById('agentStatus');

        userIdInput.value = 'user_' + Math.random().toString(36).slice(2, 8);
        
        // 엔터키 입력 처리
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        let currentSessionId = null;
        let sessionsCache = [];

        async function createSession() {
            const userId = userIdInput.value.trim();
            const topic = topicInput.value.trim();
            const userRole = document.getElementById('userRoleSelect').value === 'pro';
            if (!userId || !topic) return;

            const res = await fetch('/sessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, user_role: userRole, topic })
            });
            if (!res.ok) {
                sessionStatus.textContent = '세션 생성 실패';
                return;
            }
            const data = await res.json();
            currentSessionId = data.session_id;
            await refreshSessions();
            await loadSession(currentSessionId);
        }

        async function refreshSessions() {
            const res = await fetch('/sessions');
            if (!res.ok) {
                sessionStatus.textContent = '세션 목록 조회 실패';
                return;
            }
            const data = await res.json();
            sessionsCache = data.sessions || [];
            sessionList.innerHTML = '';

            sessionsCache.forEach(s => {
                const card = document.createElement('div');
                card.className = 'session-card' + (s.session_id === currentSessionId ? ' active' : '');
                card.onclick = () => loadSession(s.session_id);
                card.innerHTML = `
                    <div><strong>${s.topic || 'Untitled'}</strong></div>
                    <div class="session-meta">${s.session_id}</div>
                    <div class="session-meta">user: ${s.user_id || '-'} <span class="badge">${s.user_role || '-'}</span></div>
                `;
                sessionList.appendChild(card);
            });
            sessionStatus.textContent = `총 ${sessionsCache.length}개 세션`;
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            await renderHistory();
            const session = sessionsCache.find(s => s.session_id === sessionId);
            chatSub.textContent = session ? `토론 주제: ${session.topic}` : `세션: ${sessionId}`;
            await refreshSessions();
        }

        async function deleteSession() {
            if (!currentSessionId) return;
            const res = await fetch(`/sessions/${currentSessionId}`, { method: 'DELETE' });
            if (res.ok) {
                currentSessionId = null;
                chatSub.textContent = '세션을 선택해 주세요.';
                chatContainer.innerHTML = '';
                await refreshSessions();
            }
        }

        async function renderHistory() {
            if (!currentSessionId) return;
            const res = await fetch(`/sessions/${currentSessionId}/history`);
            if (!res.ok) return;
            const data = await res.json();
            const messages = data.messages || [];

            chatContainer.innerHTML = '';
            messages.filter(msg => msg.role !== 'system').forEach(msg => appendMessage(msg));
            scrollToBottom();
        }

        function appendMessage(msg) {
            const group = document.createElement('div');
            group.className = 'message-group';

            const label = document.createElement('div');
            label.className = 'message-label';
            label.textContent = msg.role || 'unknown';
            group.appendChild(label);

            const bubble = document.createElement('div');
            const role = msg.role || 'assistant';
            bubble.className = `message role-${role}`;
            bubble.innerHTML = marked.parse(msg.content || '');
            group.appendChild(bubble);

            if (role === 'user') {
                bubble.style.marginLeft = 'auto';
                label.style.textAlign = 'right';
            }

            chatContainer.appendChild(group);
        }

        async function sendMessage() {
            if (!currentSessionId) return;
            const message = messageInput.value.trim();
            if (!message) return;

            messageInput.value = '';
            appendMessage({ role: 'user', content: message });
            scrollToBottom();

            const response = await fetch(`/sessions/${currentSessionId}/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) return;

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let assistantContent = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.trim()) continue;
                    const item = JSON.parse(line);
                    
                    // 상태 업데이트
                    if (item.type === 'status') {
                        if (item.status === 'thinking') {
                            updateStatus('thinking', '생각 중...', '');
                        } else if (item.status === 'tool_calling') {
                            const toolName = item.tool_name || 'unknown';
                            updateStatus('tool', '도구 호출 중', toolName);
                        } else if (item.status === 'output') {
                            updateStatus('thinking', '응답 생성 중...', '');
                        }
                    } else if (item.type === 'output' && item.full_content) {
                        assistantContent = item.full_content;
                    }
                }
            }

            hideStatus();

            if (assistantContent) {
                appendMessage({ role: 'assistant', content: assistantContent });
                scrollToBottom();
            }

            await renderHistory();
        }

        function updateStatus(type, text, detail) {
            agentStatus.classList.remove('hidden');
            const icon = agentStatus.querySelector('.status-icon');
            const statusText = agentStatus.querySelector('.status-text');
            const statusDetail = agentStatus.querySelector('.status-detail');
            
            icon.className = `status-icon ${type}`;
            statusText.textContent = text;
            statusDetail.textContent = detail;
        }

        function hideStatus() {
            agentStatus.classList.add('hidden');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        refreshSessions();
    </script>
</body>
</html>
