# 토론 역할 설정
roles:
  # 토론 참가자 (2명)
  user_roles:
    - player_1
    - player_2
  
  # 심판 (1명)
  judge_role: judge
  
  # 사회자 (선택적)
  moderator_role: moderator

# 메시지 역할
message_roles:
  user: user
  assistant: assistant
  system: system

# 기본값
defaults:
  user_role: player_1
  opponent_role: player_2
